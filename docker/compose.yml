# Two media servers pointed at the faceted library, for scan validation.
#
# Both mount library/ read-only: neither server may write NFOs or artwork back
# into the generated tree, and coping with a read-only source is itself part of
# what is being tested.
#
# Config lives in NAMED VOLUMES, not bind mounts. Both servers keep their catalogue in
# SQLite, and SQLite on a macOS bind mount through Docker Desktop's file sharing does not
# get working POSIX locks: the database corrupts, and the first symptom is an HTTP 500
# from a library listing. A named volume lives inside the Linux VM, where locking works.
#
# The volumes survive `docker compose down`, so a claimed server keeps its libraries and
# settings. `make servers-reset` removes them; `make plex-reset-library` clears the
# library while keeping the claim.

name: testlib

services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: testlib-plex
    environment:
      TZ: ${TZ:-America/Denver}
      # ALLOWED_NETWORKS is deliberately NOT set. It grants unauthenticated access
      # to the whole API — including /:/prefs and media deletion — to every address
      # in the listed ranges, which on a published port means the entire LAN. Once
      # the server is claimed the tooling authenticates with PLEX_TOKEN instead
      # (`make plex-token`), and Plex apps authenticate through your account.
      # Set it only for an unclaimed throwaway server, and then to a single subnet.
      ALLOWED_NETWORKS: ${ALLOWED_NETWORKS:-}
      PLEX_UID: ${PLEX_UID:-1000}
      PLEX_GID: ${PLEX_GID:-1000}
      # Claim the server to a Plex account on FIRST BOOT only, so Plex apps can
      # find it and account-level features such as Plex Pass apply. Get a token
      # from https://plex.tv/claim and put it in docker/.env; it expires after
      # about four minutes. Leave empty to stay unclaimed.
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    ports:
      # 32400 is left alone: a native Plex Media Server may already own it on the
      # host, and this stack must never interfere with a real library.
      - "${PLEX_PORT:-32402}:32400"
    volumes:
      - plex-config:/config
      - plex-transcode:/transcode
      - ../library:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: testlib-jellyfin
    environment:
      TZ: ${TZ:-America/Denver}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ../library:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/System/Info/Public >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # An HDHomeRun-compatible tuner that serves library/flat as live channels, so the
  # DVR and live-TV paths can be tested without a real tuner.
  #
  # Off by default: it holds an ffmpeg process open per active channel, and most
  # runs do not need it. Start it with `make tuner`.
  #
  # The address is pinned. Plex stores a DVR device by its URI, so a tuner that
  # moves between restarts leaves a dead DVR behind that has to be deleted and
  # re-added by hand.
  tuner:
    build: ./tuner
    image: testlib-tuner:latest
    container_name: testlib-tuner
    profiles: ["tuner"]
    environment:
      TZ: ${TZ:-America/Denver}
      TUNER_HOST: ${TUNER_IP:-172.22.0.99}
      TUNER_PORT: "80"
      TUNER_MEDIA: /media/flat
      TUNER_CHANNELS: ${TUNER_CHANNELS:-6}
      FFMPEG: /usr/bin/ffmpeg
    volumes:
      - ../library:/media:ro
    networks:
      default:
        ipv4_address: ${TUNER_IP:-172.22.0.99}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/discover.json >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  # The subnet is pinned so the tuner can hold a fixed address. It matches what
  # compose already allocated, so declaring it moves nothing.
  default:
    ipam:
      config:
        - subnet: ${TESTLIB_SUBNET:-172.22.0.0/16}

volumes:
  plex-config:
  plex-transcode:
  jellyfin-config:
  jellyfin-cache:
